<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathfinder — карта</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203346;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf0ec}
#map{width:100%;height:100%;background:#edf0ec}
.leaflet-container{font-family:inherit;-webkit-tap-highlight-color:transparent}
.leaflet-control-attribution{font:11px/1.45 system-ui!important;padding:2px 6px!important;background:#ffffffe8!important;max-width:90%;border-radius:5px 0 0 0}
.leaflet-control-attribution a{color:#475569}.leaflet-bar{border:1px solid #dce3e9!important;border-radius:10px!important;overflow:hidden;box-shadow:0 2px 10px #20334614!important}
.leaflet-bar a,.pf-control button{display:grid!important;place-items:center;width:44px!important;height:44px!important;line-height:44px!important;background:#fff!important;color:#203346!important}
.pf-control{display:flex;flex-direction:column;background:#fff;border:1px solid #dce3e9;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #20334614}
.pf-control button{border:0;border-bottom:1px solid #e6eaf0;cursor:pointer;font:22px system-ui}
.pf-control button:last-child{border-bottom:0}.pf-control svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,.leaflet-bar a:focus-visible{outline:3px solid #2783de;outline-offset:-3px}
.pf-pin{width:34px;height:34px;border:3px solid #fff;border-radius:50%;background:#1768b8;color:white;display:grid;place-items:center;font:700 16px system-ui;box-shadow:0 1px 5px #20334640}
.pf-pin.finish{background:#bb324c}.pf-pin.via{background:#7654a5}
#status{position:absolute;left:12px;bottom:30px;z-index:1100;max-width:calc(100% - 24px);display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border:1px solid #dce3e9;border-radius:10px;box-shadow:0 2px 12px #20334615;font:14px/1.45 system-ui}
#status[hidden]{display:none}#status button{border:0;background:transparent;color:inherit;min-width:44px;min-height:44px;font:22px system-ui;cursor:pointer}
#status[data-kind=error]{background:#fff8ed;color:#79551d;border-color:#e8d5b4}
#boot{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:32px;color:#617284;z-index:1200;background:#f6f8fa}
#boot[hidden]{display:none}#boot strong{color:#203346;font-size:20px}#boot button{justify-self:center;min-height:44px;padding:8px 16px;border:1px solid #ccd7e1;border-radius:8px;background:#fff;font:inherit;color:#203346}
.leaflet-popup-content{font:14px/1.5 system-ui}.leaflet-popup-content-wrapper{border-radius:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="map" aria-label="Карта маршрута"></div>
<div id="boot" role="status"><strong>Pathfinder</strong><span id="boot-text">Загрузка карты…</span><button id="reload" hidden>Повторить загрузку</button></div>
<div id="status" role="status" hidden><span id="status-text"></span><button id="dismiss" aria-label="Закрыть уведомление">×</button></div>
<script>
window.pfBootTimer=setTimeout(function(){
 document.getElementById('boot-text').textContent='Карта загружается слишком долго. Проверьте интернет или доступ к CDN.';
 document.getElementById('reload').hidden=false;
},12000);
document.getElementById('reload').onclick=function(){location.reload();};
</script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body></html>
